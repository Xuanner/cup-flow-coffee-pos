  <rect width="1440" height="3600" fill="#F7F8FA"/>
  <g id="cover"><rect width="1440" height="152" fill="#1D2129"/><rect x="64" y="42" width="12" height="64" rx="6" fill="#DD2089"/><text x="96" y="72" class="h1 white">Cup Flow Coffee POS</text><text x="96" y="106" class="body" style="fill:#C9CDD4">US-S1-SYS-01 · 全局异常与权限状态 · SVG handoff</text><text x="1376" y="70" class="medium" text-anchor="end" style="fill:#FDC2DB">GLOBAL STATES v1.0</text><text x="1376" y="100" class="small" text-anchor="end" style="fill:#C9CDD4">Desktop 1280×800 · 2026-08-17</text></g>
  <g id="principles" transform="translate(64 184)"><rect width="1312" height="224" rx="16" class="section"/><text x="24" y="42" class="h2">全局状态目标</text><text x="24" y="72" class="body secondary">说明发生了什么、数据是否可能保存以及下一步动作，同时避免泄露内部系统信息。</text><g transform="translate(24 98)"><rect x="0" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="36" cy="39" r="18" fill="#1D2129"/><text x="36" y="44" class="medium white" text-anchor="middle">01</text><text x="66" y="32" class="medium">覆盖完整</text><text x="66" y="55" class="small">403、404、会话、断网、服务、超时</text><rect x="316" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="352" cy="39" r="18" fill="#1D2129"/><text x="352" y="44" class="medium white" text-anchor="middle">02</text><text x="382" y="32" class="medium">数据诚实</text><text x="382" y="55" class="small">明确已保存/未保存/待确认</text><rect x="632" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="668" cy="39" r="18" fill="#1D2129"/><text x="668" y="44" class="medium white" text-anchor="middle">03</text><text x="698" y="32" class="medium">动作匹配</text><text x="698" y="55" class="small">可重试与不可重试不同</text><rect x="948" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="984" cy="39" r="18" fill="#DD2089"/><text x="984" y="44" class="medium white" text-anchor="middle">04</text><text x="1014" y="32" class="medium">信息安全</text><text x="1014" y="55" class="small">不展示堆栈、令牌和服务名</text></g><text x="24" y="204" class="small">品牌粉仅用于品牌标识；主动作、选中和 Focus Visible 使用 #1D2129。</text></g>
 <text x="64" y="468" class="h2">01  Page-level states</text><text x="1376" y="468" class="small" text-anchor="end">403、404、会话过期使用整页或受保护区域状态</text>
 <g transform="translate(64 504)"><g id="frame-system-0" transform="translate(0)"><rect width="416" height="700" rx="16" class="section"/><rect width="416" height="72" rx="16" fill="#1D2129"/><rect y="56" width="416" height="16" fill="#1D2129"/><text x="24" y="32" class="medium white">403 / Page state</text><text x="24" y="54" class="tiny" style="fill:#C9CDD4">不可重试</text><circle cx="208" cy="190" r="54" fill="#FEE2E2"/><text x="208" y="202" font-size="28" font-weight="700" style="fill:#DC2626" text-anchor="middle">403</text><text x="208" y="292" class="h3" text-anchor="middle">无权访问此页面</text><text x="208" y="326" class="small" text-anchor="middle">你的账号没有查看该模块的权限。</text><rect x="28" y="366" width="360" height="104" rx="10" fill="#F7F8FA"/><text x="44" y="398" class="medium">数据状态</text><text x="44" y="428" class="small">当前页面未读取或修改任何数据。</text><rect x="28" y="510" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="543" class="medium white" text-anchor="middle">返回有权限的首页</text><text x="208" y="600" class="tiny" text-anchor="middle">错误编号可用于支持查询，但不展示技术详情</text></g><g id="frame-system-1" transform="translate(448)"><rect width="416" height="700" rx="16" class="section"/><rect width="416" height="72" rx="16" fill="#1D2129"/><rect y="56" width="416" height="16" fill="#1D2129"/><text x="24" y="32" class="medium white">404 / Page state</text><text x="24" y="54" class="tiny" style="fill:#C9CDD4">不可重试</text><circle cx="208" cy="190" r="54" fill="#F2F3F5"/><text x="208" y="202" font-size="28" font-weight="700" style="fill:#4E5969" text-anchor="middle">404</text><text x="208" y="292" class="h3" text-anchor="middle">找不到此页面</text><text x="208" y="326" class="small" text-anchor="middle">链接可能已失效或地址输入有误。</text><rect x="28" y="366" width="360" height="104" rx="10" fill="#F7F8FA"/><text x="44" y="398" class="medium">数据状态</text><text x="44" y="428" class="small">没有发生数据变更。</text><rect x="28" y="510" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="543" class="medium white" text-anchor="middle">返回首页</text><text x="208" y="600" class="tiny" text-anchor="middle">错误编号可用于支持查询，但不展示技术详情</text></g><g id="frame-system-2" transform="translate(896)"><rect width="416" height="700" rx="16" class="section"/><rect width="416" height="72" rx="16" fill="#1D2129"/><rect y="56" width="416" height="16" fill="#1D2129"/><text x="24" y="32" class="medium white">Session / Page state</text><text x="24" y="54" class="tiny" style="fill:#C9CDD4">需重新认证</text><circle cx="208" cy="190" r="54" fill="#DBEAFE"/><text x="208" y="202" font-size="28" font-weight="700" style="fill:#2563EB" text-anchor="middle">↻</text><text x="208" y="292" class="h3" text-anchor="middle">登录状态已失效</text><text x="208" y="326" class="small" text-anchor="middle">为保护账号安全，请重新登录。</text><rect x="28" y="366" width="360" height="104" rx="10" fill="#F7F8FA"/><text x="44" y="398" class="medium">数据状态</text><text x="44" y="428" class="small">未提交操作未保存；已保存数据不受影响。</text><rect x="28" y="510" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="543" class="medium white" text-anchor="middle">重新登录</text><text x="208" y="600" class="tiny" text-anchor="middle">错误编号可用于支持查询，但不展示技术详情</text></g></g>
 <text x="64" y="1300" class="h2">02  Network and service states</text><text x="1376" y="1300" class="small" text-anchor="end">可重试不等于保证成功；结果未知先查询最新状态</text>
 <g transform="translate(64 1336)"><g id="frame-system-3" transform="translate(0)"><rect width="416" height="610" rx="16" class="section"/><circle cx="208" cy="104" r="48" fill="#FEF3C7"/><text x="208" y="114" font-size="24" font-weight="700" style="fill:#B45309" text-anchor="middle">⌁</text><text x="208" y="188" class="h3" text-anchor="middle">网络连接已断开</text><text x="208" y="224" class="small" text-anchor="middle">本地尚未提交的内容仍保留。恢复网络后再重试。</text><rect x="28" y="276" width="360" height="92" rx="10" fill="#F7F8FA"/><text x="44" y="308" class="medium">恢复策略 · 可重试</text><text x="44" y="338" class="small">重试只会再次发起操作，不承诺一定成功。</text><rect x="28" y="410" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="443" class="medium white" text-anchor="middle">检查网络</text><rect x="28" y="478" width="360" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="208" y="506" class="medium" text-anchor="middle">返回安全页面</text><text x="208" y="566" class="tiny" text-anchor="middle">参考编号 SYS-201 · 不包含内部服务名称</text></g><g id="frame-system-4" transform="translate(448)"><rect width="416" height="610" rx="16" class="section"/><circle cx="208" cy="104" r="48" fill="#FEE2E2"/><text x="208" y="114" font-size="24" font-weight="700" style="fill:#DC2626" text-anchor="middle">!</text><text x="208" y="188" class="h3" text-anchor="middle">服务暂时不可用</text><text x="208" y="224" class="small" text-anchor="middle">本次请求未完成；无法确认数据是否已保存。</text><rect x="28" y="276" width="360" height="92" rx="10" fill="#F7F8FA"/><text x="44" y="308" class="medium">恢复策略 · 可重试</text><text x="44" y="338" class="small">重试只会再次发起操作，不承诺一定成功。</text><rect x="28" y="410" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="443" class="medium white" text-anchor="middle">稍后重试</text><rect x="28" y="478" width="360" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="208" y="506" class="medium" text-anchor="middle">返回安全页面</text><text x="208" y="566" class="tiny" text-anchor="middle">参考编号 SYS-202 · 不包含内部服务名称</text></g><g id="frame-system-5" transform="translate(896)"><rect width="416" height="610" rx="16" class="section"/><circle cx="208" cy="104" r="48" fill="#FEF3C7"/><text x="208" y="114" font-size="24" font-weight="700" style="fill:#B45309" text-anchor="middle">…</text><text x="208" y="188" class="h3" text-anchor="middle">请求处理超时</text><text x="208" y="224" class="small" text-anchor="middle">结果可能已保存，请先刷新或查询最新状态。</text><rect x="28" y="276" width="360" height="92" rx="10" fill="#F7F8FA"/><text x="44" y="308" class="medium">恢复策略 · 先确认</text><text x="44" y="338" class="small">重试只会再次发起操作，不承诺一定成功。</text><rect x="28" y="410" width="360" height="52" rx="10" fill="#1D2129"/><text x="208" y="443" class="medium white" text-anchor="middle">查询最新状态</text><rect x="28" y="478" width="360" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="208" y="506" class="medium" text-anchor="middle">返回安全页面</text><text x="208" y="566" class="tiny" text-anchor="middle">参考编号 SYS-203 · 不包含内部服务名称</text></g></g>
 <text x="64" y="2030" class="h2">03  Inline and blocking usage</text><text x="1376" y="2030" class="small" text-anchor="end">页面级、区域级和 Toast 按影响范围选择</text>
 <g transform="translate(64 2066)"><rect width="1312" height="490" rx="16" class="section"/><g transform="translate(24 28)"><text class="h3" y="22">呈现层级</text><g transform="translate(0 54)"><rect width="1264" height="68" rx="10" fill="#F7F8FA"/><text x="16" y="28" class="medium">Page</text><text x="180" y="28" class="body secondary">403、404、会话过期</text><text x="650" y="28" class="body secondary">替换主要内容；保留品牌或安全导航</text><text x="16" y="52" class="small">状态必须包含：发生了什么 · 数据状态 · 下一步动作</text></g><g transform="translate(0 136)"><rect width="1264" height="68" rx="10" fill="#F7F8FA"/><text x="16" y="28" class="medium">Section</text><text x="180" y="28" class="body secondary">看板/列表部分加载失败</text><text x="650" y="28" class="body secondary">只替换失败区域；其他成功数据保留</text><text x="16" y="52" class="small">状态必须包含：发生了什么 · 数据状态 · 下一步动作</text></g><g transform="translate(0 218)"><rect width="1264" height="68" rx="10" fill="#F7F8FA"/><text x="16" y="28" class="medium">Dialog</text><text x="180" y="28" class="body secondary">交易结果未知、危险操作冲突</text><text x="650" y="28" class="body secondary">阻断继续，提供确认最新状态的动作</text><text x="16" y="52" class="small">状态必须包含：发生了什么 · 数据状态 · 下一步动作</text></g><g transform="translate(0 300)"><rect width="1264" height="68" rx="10" fill="#F7F8FA"/><text x="16" y="28" class="medium">Toast/Banner</text><text x="180" y="28" class="body secondary">断网、恢复联网、后台刷新失败</text><text x="650" y="28" class="body secondary">非打断反馈；需要行动时升级为区域提示</text><text x="16" y="52" class="small">状态必须包含：发生了什么 · 数据状态 · 下一步动作</text></g></g></g>
 <g transform="translate(64 2630)"><rect width="1312" height="810" rx="16" class="section"/><text x="24" y="42" class="h2">04  状态矩阵与安全交接</text><text x="24" y="82" class="medium">状态</text><text x="230" y="82" class="medium">是否重试</text><text x="430" y="82" class="medium">数据说明</text><text x="900" y="82" class="medium">主动作</text><line x1="24" y1="100" x2="1288" y2="100" class="line"/><text x="24" y="144" class="body">403</text><text x="230" y="144" class="body secondary">否</text><text x="430" y="144" class="body secondary">未执行读取或变更</text><text x="900" y="144" class="body secondary">返回有权限首页</text><line x1="24" y1="164" x2="1288" y2="164" class="line"/><text x="24" y="204" class="body">404</text><text x="230" y="204" class="body secondary">否</text><text x="430" y="204" class="body secondary">没有数据变更</text><text x="900" y="204" class="body secondary">返回首页</text><line x1="24" y1="224" x2="1288" y2="224" class="line"/><text x="24" y="264" class="body">会话过期</text><text x="230" y="264" class="body secondary">重新认证</text><text x="430" y="264" class="body secondary">未提交未保存；已保存不受影响</text><text x="900" y="264" class="body secondary">重新登录</text><line x1="24" y1="284" x2="1288" y2="284" class="line"/><text x="24" y="324" class="body">断网</text><text x="230" y="324" class="body secondary">网络恢复后</text><text x="430" y="324" class="body secondary">本地输入保留；请求未发出</text><text x="900" y="324" class="body secondary">检查网络</text><line x1="24" y1="344" x2="1288" y2="344" class="line"/><text x="24" y="384" class="body">服务异常</text><text x="230" y="384" class="body secondary">可以</text><text x="430" y="384" class="body secondary">本次请求未完成；保存状态可能未知</text><text x="900" y="384" class="body secondary">稍后重试</text><line x1="24" y1="404" x2="1288" y2="404" class="line"/><text x="24" y="444" class="body">请求超时</text><text x="230" y="444" class="body secondary">先确认</text><text x="430" y="444" class="body secondary">结果可能已保存</text><text x="900" y="444" class="body secondary">查询最新状态</text><line x1="24" y1="464" x2="1288" y2="464" class="line"/><rect x="24" y="490" width="1264" height="112" rx="10" fill="#FEE2E2"/><text x="40" y="522" class="medium error">禁止展示</text><text x="40" y="550" class="small" style="fill:#7A271A">异常堆栈、数据库信息、访问令牌、Cookie、内部主机名、微服务名、请求体中的敏感字段。</text><text x="40" y="576" class="small" style="fill:#7A271A">用户只看到可理解的参考编号；完整技术详情记录在受控日志中。</text><rect x="24" y="636" width="1264" height="88" rx="10" fill="#F2F3F5"/><text x="40" y="668" class="medium">可访问性</text><text x="40" y="696" class="small">页面标题首先描述状态；阻断错误使用 alert；网络 Banner 使用 status；重试后更新同一区域并管理焦点。</text></g>
