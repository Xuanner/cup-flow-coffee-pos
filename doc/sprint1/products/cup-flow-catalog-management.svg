dle">重新加载</text></g></g><g transform="translate(64 2610)"><rect width="1312" height="650" rx="16" class="section"/><text x="24" y="42" class="h2">04  确认与交接</text><text x="24" y="82" class="medium">操作</text><text x="250" y="82" class="medium">即时影响</text><text x="760" y="82" class="medium">确认规则</text><line x1="24" y1="100" x2="1288" y2="100" class="line"/><text x="24" y="144" class="body">停用分类</text><text x="250" y="144" class="body secondary">分类及商品不在 POS 展示</text><text x="760" y="144" class="body secondary">显示商品数量；历史订单不受影响</text><line x1="24" y1="164" x2="1288" y2="164" class="line"/><text x="24" y="204" class="body">商品下架</text><text x="250" y="204" class="body secondary">商品不再出现在 POS</text><text x="760" y="204" class="body secondary">需要确认；已在购物车的结算时被拦截</text><line x1="24" y1="224" x2="1288" y2="224" class="line"/><text x="24" y="264" class="body">设置售罄</text><text x="250" y="264" class="body secondary">POS 显示售罄且不可添加</text><text x="760" y="264" class="body secondary">快捷操作仍需明确当前商品</text><line x1="24" y1="284" x2="1288" y2="284" class="line"/><text x="24" y="324" class="body">恢复在售</text><text x="250" y="324" class="body secondary">刷新 POS 数据后可再次添加</text><text x="760" y="324" class="body secondary">普通确认或即时 Toast</text><line x1="24" y1="344" x2="1288" y2="344" class="line"/><text x="24" y="384" class="body">修改价格</text><text x="250" y="384" class="body secondary">仅新订单使用新价格</text><text x="760" y="384" class="body secondary">历史订单保留价格快照</text><line x1="24" y1="404" x2="1288" y2="404" class="line"/><rect x="24" y="438" width="1264" height="92" rx="10" fill="#F2F3F5"/><text x="40" y="470" class="medium">可访问性</text><text x="40" y="498" class="small">表格状态使用文字标签；排序按钮提供当前位置与移动动作；危险确认初始焦点在取消；Toast 公告保存结果。</text><text x="40" y="520" class="small">名称、分类、状态筛选均有可访问名称，组合筛选结果变化使用 polite status。</text></g>
