<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3200" viewBox="0 0 1440 3200">
  <title>Cup Flow Coffee POS — US-S1-PRODUCT-02 商品选项配置设计</title>
  <desc>杯型、温度、糖度、加料的名称、加价、必选、默认、状态、校验和历史快照说明。</desc>
  <defs>
