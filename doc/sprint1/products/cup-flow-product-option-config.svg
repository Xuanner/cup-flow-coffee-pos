  <rect width="1440" height="3200" fill="#F7F8FA"/>
  <g id="cover"><rect width="1440" height="152" fill="#1D2129"/><rect x="64" y="42" width="12" height="64" rx="6" fill="#DD2089"/><text x="96" y="72" class="h1 white">Cup Flow Coffee POS</text><text x="96" y="106" class="body" style="fill:#C9CDD4">US-S1-PRODUCT-02 · 商品选项配置设计 · SVG handoff</text><text x="1376" y="70" class="medium" text-anchor="end" style="fill:#FDC2DB">OPTION CONFIG v1.0</text><text x="1376" y="100" class="small" text-anchor="end" style="fill:#C9CDD4">Desktop 1280×800 · 2026-08-17</text></g>
  <g id="principles" transform="translate(64 184)"><rect width="1312" height="224" rx="16" class="section"/><text x="24" y="42" class="h2">选项配置目标</text><text x="24" y="72" class="body secondary">管理员只发布有效的规格与加料组合，保证 POS 默认值可用且历史订单快照不被修改。</text><g transform="translate(24 98)"><rect x="0" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="36" cy="39" r="18" fill="#1D2129"/><text x="36" y="44" class="medium white" text-anchor="middle">01</text><text x="66" y="32" class="medium">类型完整</text><text x="66" y="55" class="small">杯型、温度、糖度、加料</text><rect x="316" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="352" cy="39" r="18" fill="#1D2129"/><text x="352" y="44" class="medium white" text-anchor="middle">02</text><text x="382" y="32" class="medium">规则明确</text><text x="382" y="55" class="small">名称、加价、必选、默认、状态</text><rect x="632" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="668" cy="39" r="18" fill="#1D2129"/><text x="668" y="44" class="medium white" text-anchor="middle">03</text><text x="698" y="32" class="medium">组合有效</text><text x="698" y="55" class="small">必选单选至少一个有效值</text><rect x="948" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="984" cy="39" r="18" fill="#DD2089"/><text x="984" y="44" class="medium white" text-anchor="middle">04</text><text x="1014" y="32" class="medium">历史安全</text><text x="1014" y="55" class="small">变更只影响新订单</text></g><text x="24" y="204" class="small">品牌粉仅用于品牌标识；主动作、选中和 Focus Visible 使用 #1D2129。</text></g>
 <text x="64" y="468" class="h2">01  Option configuration</text><text x="1376" y="468" class="small" text-anchor="end">商品“拿铁” · 选项组与值同屏编辑</text>
 <g id="frame-option-config" transform="translate(80 500)"><rect width="1280" height="800" rx="16" fill="#F7F8FA" stroke="#E5E6EB"/><path d="M16 0H200V800H16Q0 800 0 784V16Q0 0 16 0Z" fill="#FFF"/><line x1="200" y1="0" x2="200" y2="800" class="line"/><circle cx="36" cy="36" r="20" fill="#FFE8F1"/><text x="64" y="34" class="medium">Cup Flow</text><text x="64" y="52" class="tiny">Coffee POS</text><g transform="translate(16 92)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">收银台</text></g><g transform="translate(16 148)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">订单</text></g><g transform="translate(16 204)"><rect width="168" height="48" rx="10" fill="#F2F3F5"/><rect width="4" height="48" rx="2" fill="#1D2129"/><text x="20" y="30" class="medium">商品</text></g><g transform="translate(16 260)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">经营看板</text></g><g transform="translate(200)"><rect width="1080" height="72" fill="#FFF"/><text x="24" y="42" class="h3">商品选项 · 拿铁</text><rect x="902" y="16" width="154" height="40" rx="9" fill="#1D2129"/><text x="979" y="42" class="medium white" text-anchor="middle">保存配置</text><g transform="translate(24 92)"><rect width="1032" height="684" rx="14" fill="#FFF"/><g transform="translate(20 20)"><rect width="188" height="644" rx="10" fill="#F7F8FA"/><g transform="translate(8 8)"><rect width="172" height="70" rx="9" fill="#F2F3F5"/><rect width="4" height="70" rx="2" fill="#1D2129"/><text x="16" y="28" class="medium">杯型</text><text x="16" y="50" class="small">3 个值 · 必选 · 单选</text></g><g transform="translate(8 90)"><rect width="172" height="70" rx="9" fill="#F7F8FA"/><text x="16" y="28" class="medium">温度</text><text x="16" y="50" class="small">2 个值 · 必选 · 单选</text></g><g transform="translate(8 172)"><rect width="172" height="70" rx="9" fill="#F7F8FA"/><text x="16" y="28" class="medium">糖度</text><text x="16" y="50" class="small">4 个值 · 必选 · 单选</text></g><g transform="translate(8 254)"><rect width="172" height="70" rx="9" fill="#F7F8FA"/><text x="16" y="28" class="medium">加料</text><text x="16" y="50" class="small">6 个值 · 可选 · 多选</text></g><rect x="8" y="356" width="172" height="44" rx="9" fill="#1D2129"/><text x="94" y="384" class="medium white" text-anchor="middle">新增选项组</text></g><g transform="translate(228 0)"><text y="30" class="h3">杯型</text><rect x="64" y="10" width="42" height="24" rx="12" fill="#F2F3F5"/><text x="85" y="27" class="tiny" text-anchor="middle">必选</text><rect x="116" y="10" width="54" height="24" rx="12" fill="#F2F3F5"/><text x="143" y="27" class="tiny" text-anchor="middle">单选</text><text x="760" y="28" class="small" text-anchor="end">拖动排序 · 默认值必须为启用状态</text><line y1="52" x2="784" class="line"/><text y="84" class="medium">名称</text><text x="250" y="84" class="medium">加价</text><text x="410" y="84" class="medium">默认值</text><text x="532" y="84" class="medium">状态</text><text x="760" y="84" class="medium" text-anchor="end">操作</text><g transform="translate(0 100)"><rect width="784" height="64" rx="9" fill="#F7F8FA"/><text x="16" y="40" class="medium">⋮⋮ 中杯</text><text x="250" y="40" class="body">¥0.00</text><rect x="410" y="18" width="44" height="28" rx="14" fill="#E5E6EB"/><circle cx="424" cy="32" r="10" fill="#FFF"/><rect x="532" y="18" width="72" height="28" rx="14" fill="#DCFCE7"/><text x="568" y="37" class="small" style="fill:#15803D" text-anchor="middle">启用</text><text x="760" y="40" class="medium" text-anchor="end">编辑 · 删除</text></g><g transform="translate(0 176)"><rect width="784" height="64" rx="9" fill="#F7F8FA"/><text x="16" y="40" class="medium">⋮⋮ 大杯</text><text x="250" y="40" class="body">¥3.00</text><rect x="410" y="18" width="44" height="28" rx="14" fill="#1D2129"/><circle cx="440" cy="32" r="10" fill="#FFF"/><rect x="532" y="18" width="72" height="28" rx="14" fill="#DCFCE7"/><text x="568" y="37" class="small" style="fill:#15803D" text-anchor="middle">启用</text><text x="760" y="40" class="medium" text-anchor="end">编辑 · 删除</text></g><g transform="translate(0 252)"><rect width="784" height="64" rx="9" fill="#F7F8FA"/><text x="16" y="40" class="medium">⋮⋮ 超大杯</text><text x="250" y="40" class="body">¥5.00</text><rect x="410" y="18" width="44" height="28" rx="14" fill="#E5E6EB"/><circle cx="424" cy="32" r="10" fill="#FFF"/><rect x="532" y="18" width="72" height="28" rx="14" fill="#F2F3F5"/><text x="568" y="37" class="small" style="fill:#4E5969" text-anchor="middle">停用</text><text x="760" y="40" class="medium" text-anchor="end">编辑 · 删除</text></g><rect y="352" width="784" height="52" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="392" y="384" class="medium" text-anchor="middle">＋ 添加杯型值</text><rect y="436" width="784" height="128" rx="10" fill="#F2F3F5"/><text x="16" y="468" class="medium">规则</text><text x="16" y="496" class="small">必选单选组至少保留一个启用值；只能设置一个默认值，且默认值必须启用。</text><text x="16" y="522" class="small">加价可为 ¥0.00，不得为负；名称在同一选项组内不可重复。</text><text x="16" y="548" class="small">停用选项后不在新订单显示，历史订单配置快照不变。</text></g></g></g> </g>
 <text x="64" y="1380" class="h2">02  Validation and save failures</text><text x="1376" y="1380" class="small" text-anchor="end">字段级错误优先；跨组选项问题使用模块摘要</text>
 <g transform="translate(64 1416)"><g id="frame-option-invalid"><rect width="640" height="650" rx="16" class="section"/><text x="28" y="44" class="h3">无效组合</text><g transform="translate(28 86)"><rect width="584" height="84" rx="10" fill="#FEE2E2"/><text x="16" y="32" class="medium error">无法保存配置</text><text x="16" y="58" class="small" style="fill:#7A271A">“温度”是必选单选组，但没有启用的选项。</text><text y="126" class="medium">温度</text><rect y="144" width="584" height="166" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="1.5"/><text x="16" y="176" class="body" style="fill:#86909C">热 · 停用</text><text x="16" y="218" class="body" style="fill:#86909C">冰 · 停用</text><text x="16" y="284" class="small error">至少启用一个选项，并将其中一个设为默认值。</text><rect y="338" width="584" height="84" rx="10" fill="#F7F8FA"/><text x="16" y="368" class="medium">首错聚焦</text><text x="16" y="394" class="small">滚动至温度组，聚焦第一个可修复控件“启用热”。</text><rect y="456" width="584" height="48" rx="9" fill="#F2F3F5"/><text x="292" y="486" class="medium" style="fill:#A9AEB8" text-anchor="middle">修复错误后保存</text></g></g><g id="frame-option-save-failed" transform="translate(672)"><rect width="640" height="650" rx="16" class="section"/><text x="28" y="44" class="h3">保存失败</text><g transform="translate(28 86)"><rect width="584" height="96" rx="10" fill="#FEE2E2"/><text x="16" y="32" class="medium error">配置未保存</text><text x="16" y="58" class="small" style="fill:#7A271A">保留当前编辑内容，可稍后重试。</text><text x="16" y="80" class="small" style="fill:#7A271A">错误编号 OPT-SAVE-104，不显示内部服务信息。</text><rect y="130" width="584" height="108" rx="10" fill="#F7F8FA"/><text x="16" y="160" class="medium">数据状态</text><text x="16" y="186" class="small">本地编辑尚未发布，POS 继续使用上一次成功配置。</text><text x="16" y="212" class="small">历史订单快照始终不受影响。</text><rect y="278" width="280" height="48" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="140" y="308" class="medium" text-anchor="middle">稍后处理</text><rect x="304" y="278" width="280" height="48" rx="9" fill="#1D2129"/><text x="444" y="308" class="medium white" text-anchor="middle">重新保存</text><rect y="366" width="584" height="106" rx="10" fill="#F2F3F5"/><text x="16" y="396" class="medium">并发变化</text><text x="16" y="422" class="small">如配置已被他人更新，展示差异并要求刷新，不自动覆盖。</text><text x="16" y="446" class="small">刷新前允许复制未保存内容。</text></g></g></g>
 <g transform="translate(64 2150)"><rect width="1312" height="890" rx="16" class="section"/><text x="24" y="42" class="h2">03  规则矩阵与交接</text><text x="24" y="82" class="medium">类型</text><text x="210" y="82" class="medium">模式</text><text x="390" y="82" class="medium">建议默认</text><text x="640" y="82" class="medium">校验</text><line x1="24" y1="100" x2="1288" y2="100" class="line"/><text x="24" y="144" class="body">杯型</text><text x="210" y="144" class="body secondary">必选单选</text><text x="390" y="144" class="body secondary">中杯或业务默认</text><text x="640" y="144" class="body secondary">至少 1 个启用值；默认值启用</text><line x1="24" y1="164" x2="1288" y2="164" class="line"/><text x="24" y="206" class="body">温度</text><text x="210" y="206" class="body secondary">必选单选</text><text x="390" y="206" class="body secondary">热或业务默认</text><text x="640" y="206" class="body secondary">至少 1 个启用值；默认值启用</text><line x1="24" y1="226" x2="1288" y2="226" class="line"/><text x="24" y="268" class="body">糖度</text><text x="210" y="268" class="body secondary">必选单选</text><text x="390" y="268" class="body secondary">标准糖或业务默认</text><text x="640" y="268" class="body secondary">至少 1 个启用值；默认值启用</text><line x1="24" y1="288" x2="1288" y2="288" class="line"/><text x="24" y="330" class="body">加料</text><text x="210" y="330" class="body secondary">可选多选</text><text x="390" y="330" class="body secondary">通常无默认</text><text x="640" y="330" class="body secondary">加价非负；可设置最大选择数</text><line x1="24" y1="350" x2="1288" y2="350" class="line"/><rect x="24" y="380" width="1264" height="112" rx="10" fill="#DBEAFE"/><text x="40" y="412" class="medium info">历史订单快照</text><text x="40" y="440" class="small" style="fill:#173B70">名称、加价、默认值或状态变更只影响保存后创建的新订单。</text><text x="40" y="466" class="small" style="fill:#173B70">历史订单详情继续展示下单时的商品名称、选项名称和价格，不回写当前配置。</text><rect x="24" y="526" width="1264" height="126" rx="10" fill="#F7F8FA"/><text x="40" y="558" class="medium">交互</text><text x="40" y="586" class="small">拖动排序同时提供键盘“上移/下移”；默认值使用 Radio 语义；状态使用 Switch；删除需说明是否被商品引用。</text><text x="40" y="612" class="small">保存中禁用重复提交；字段错误关联具体控件；模块错误摘要包含可跳转链接。</text><text x="40" y="636" class="small">配置发布成功后 Toast 明确“只影响新订单”。</text><rect x="24" y="688" width="1264" height="70" rx="10" fill="#F2F3F5"/><text x="40" y="730" class="small">Primary/Focus #1D2129 · Error #DC2626/#FEE2E2 · Success #15803D/#DCFCE7 · Disabled #E5E6EB/#86909C</text></g>
