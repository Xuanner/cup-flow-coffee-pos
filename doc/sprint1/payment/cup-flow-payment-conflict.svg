<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3020" viewBox="0 0 1440 3020">
  <title>Cup Flow Coffee POS — US-S1-PAY-02 价格或状态冲突设计</title>
  <desc>覆盖价格变化、售罄、下架与重新确认订单总额。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1D2129}.h1{font-size:30px;font-weight:600}.h2{font-size:24px;font-weight:600}.h3{font-size:18px;font-weight:600}.title{font-size:28px;font-weight:700}.body{font-size:14px}.medium{font-size:14px;font-weight:500}.small{font-size:12px;fill:#6B7785}.tiny{font-size:11px;fill:#6B7785}.white{fill:#FFF}.secondary{fill:#4E5969}.muted{fill:#6B7785}.error{fill:#DC2626}.success{fill:#15803D}.warning{fill:#B45309}.info{fill:#2563EB}.section{fill:#FFF;stroke:#E5E6EB}.card{fill:#FFF;stroke:#E5E6EB}.line{stroke:#E5E6EB}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1D2129" flood-opacity=".14"/></filter>
    <symbol id="check" viewBox="0 0 20 20"><path d="M4.5 10.5L8.3 14L15.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="x" viewBox="0 0 20 20"><path d="M5 5L15 15M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="1440" height="3020" fill="#F7F8FA"/>
  <g id="cover"><rect width="1440" height="152" fill="#1D2129"/><rect x="64" y="42" width="12" height="64" rx="6" fill="#DD2089"/><text x="96" y="72" class="h1 white">Cup Flow Coffee POS</text><text x="96" y="106" class="body" style="fill:#C9CDD4">US-S1-PAY-02 · 价格或状态冲突设计 · SVG handoff</text><text x="1376" y="70" class="medium" text-anchor="end" style="fill:#FDC2DB">PAYMENT CONFLICT v1.0</text><text x="1376" y="100" class="small" text-anchor="end" style="fill:#C9CDD4">Desktop 1280×800 · 2026-08-17</text></g>
  <g id="principles" transform="translate(64 184)"><rect width="1312" height="224" rx="16" class="section"/><text x="24" y="42" class="h2">冲突处理目标</text><text x="24" y="72" class="body secondary">结算校验发现价格或售卖状态变化时，暂停创建订单和收款，并让收银员安全返回处理。</text><g transform="translate(24 98)"><rect x="0" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="36" cy="39" r="18" fill="#1D2129"/><text x="36" y="44" class="medium white" text-anchor="middle">01</text><text x="66" y="32" class="medium">对象明确</text><text x="66" y="55" class="small">指出具体商品和配置</text><rect x="316" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="352" cy="39" r="18" fill="#1D2129"/><text x="352" y="44" class="medium white" text-anchor="middle">02</text><text x="382" y="32" class="medium">前后对比</text><text x="382" y="55" class="small">原值、当前值和总额差异</text><rect x="632" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="668" cy="39" r="18" fill="#1D2129"/><text x="668" y="44" class="medium white" text-anchor="middle">03</text><text x="698" y="32" class="medium">阻止误收</text><text x="698" y="55" class="small">售罄/下架不可继续</text><rect x="948" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="984" cy="39" r="18" fill="#DD2089"/><text x="984" y="44" class="medium white" text-anchor="middle">04</text><text x="1014" y="32" class="medium">结果诚实</text><text x="1014" y="55" class="small">明确尚未创建订单或收款</text></g><text x="24" y="204" class="small">品牌粉仅用于品牌标识；主动作、选中和 Focus Visible 使用 #1D2129。</text></g>
  <text x="64" y="468" class="h2">01  Price changed / 重新确认总额</text><text x="1376" y="468" class="small" text-anchor="end">价格变化允许确认新价格后继续，但必须显式确认</text>
  <g id="frame-conflict-price" transform="translate(80 500)"><rect width="1280" height="800" rx="16" fill="#F7F8FA" stroke="#E5E6EB"/><rect width="1280" height="800" rx="16" fill="#1D2129" opacity=".3"/><g transform="translate(320 110)"><rect width="640" height="580" rx="18" fill="#FFF" filter="url(#shadow)"/><circle cx="52" cy="52" r="24" fill="#FEF3C7"/><text x="52" y="59" class="h3 warning" text-anchor="middle">!</text><text x="88" y="48" class="h3">商品价格已更新</text><text x="88" y="72" class="small">尚未创建订单，也未发生收款</text><line y1="96" x2="640" class="line"/><g transform="translate(28 122)"><text class="medium" y="18">拿铁 · 大杯 · 热 · 少糖</text><rect y="36" width="584" height="112" rx="10" fill="#F7F8FA"/><text x="16" y="68" class="small">原单价</text><text x="180" y="68" class="body" text-decoration="line-through">¥27.00</text><text x="16" y="104" class="small">当前单价</text><text x="180" y="106" class="h3">¥29.00</text><rect x="446" y="54" width="122" height="36" rx="18" fill="#FEF3C7"/><text x="507" y="77" class="small warning" text-anchor="middle">上涨 ¥2.00</text><text y="184" class="medium">订单总额变化</text><rect y="202" width="584" height="86" rx="10" fill="#F2F3F5"/><text x="16" y="234" class="small">原总额 ¥63.00</text><text x="568" y="240" font-size="24" font-weight="600" text-anchor="end">新总额 ¥65.00</text><text x="16" y="274" class="small">确认后将按新价格创建待支付订单，再进入收款。</text><rect y="326" width="276" height="52" rx="10" fill="#FFF" stroke="#C9CDD4"/><text x="138" y="359" class="medium" text-anchor="middle">返回购物车</text><rect x="308" y="326" width="276" height="52" rx="10" fill="#1D2129"/><text x="446" y="359" class="medium white" text-anchor="middle">确认新总额 ¥65.00</text></g></g></g>
  <text x="64" y="1380" class="h2">02  Unavailable products / 售罄与下架</text><text x="1376" y="1380" class="small" text-anchor="end">不可直接继续收款，只提供返回购物车处理</text>
  <g transform="translate(64 1416)"><g id="frame-conflict-sold-out"><rect width="640" height="620" rx="16" class="section"/><text x="28" y="44" class="h3">商品已售罄</text><text x="28" y="72" class="small">结算校验时间 10:32:18 · 尚未创建订单</text><g transform="translate(28 104)"><rect width="584" height="118" rx="10" fill="#FEE2E2"/><text x="16" y="34" class="medium error">摩卡 × 1</text><text x="16" y="64" class="small" style="fill:#7A271A">加入购物车时：在售 · ¥25.00</text><text x="16" y="88" class="small" style="fill:#7A271A">当前状态：已售罄 · 不可下单</text><text x="16" y="108" class="small" style="fill:#7A271A">请移除或替换该商品。</text><rect y="150" width="584" height="76" rx="10" fill="#F7F8FA"/><text x="16" y="180" class="medium">影响</text><text x="16" y="204" class="small">购物车其他商品保留；收款未开始，不会产生半完成交易。</text><rect y="270" width="584" height="52" rx="10" fill="#1D2129"/><text x="292" y="303" class="medium white" text-anchor="middle">返回购物车处理</text><rect y="354" width="584" height="72" rx="10" fill="#F2F3F5"/><text x="16" y="384" class="small">不提供“忽略并继续”或收款按钮。</text><text x="16" y="408" class="small">返回后定位并高亮发生冲突的订单项。</text></g></g><g id="frame-conflict-off-sale" transform="translate(672)"><rect width="640" height="620" rx="16" class="section"/><text x="28" y="44" class="h3">商品已下架</text><text x="28" y="72" class="small">下架与售罄使用不同原因文案，相同阻止规则</text><g transform="translate(28 104)"><rect width="584" height="118" rx="10" fill="#FEE2E2"/><text x="16" y="34" class="medium error">焦糖玛奇朵 × 1</text><text x="16" y="64" class="small" style="fill:#7A271A">加入购物车时：已上架 · ¥26.00</text><text x="16" y="88" class="small" style="fill:#7A271A">当前状态：已下架 · 不可下单</text><text x="16" y="108" class="small" style="fill:#7A271A">请从购物车移除。</text><rect y="150" width="584" height="76" rx="10" fill="#F7F8FA"/><text x="16" y="180" class="medium">影响</text><text x="16" y="204" class="small">不暴露后台下架原因；历史订单快照不受影响。</text><rect y="270" width="584" height="52" rx="10" fill="#1D2129"/><text x="292" y="303" class="medium white" text-anchor="middle">返回购物车处理</text><rect y="354" width="584" height="72" rx="10" fill="#F2F3F5"/><text x="16" y="384" class="small">冲突项必须处理后才能重新结算。</text><text x="16" y="408" class="small">重新结算时服务端再次校验全部商品。</text></g></g></g>
  <g transform="translate(64 2120)"><rect width="1312" height="760" rx="16" class="section"/><text x="24" y="42" class="h2">03  交接与状态规则</text><text x="24" y="82" class="medium">冲突类型</text><text x="260" y="82" class="medium">原值与当前值</text><text x="720" y="82" class="medium">合法动作</text><line x1="24" y1="98" x2="1288" y2="98" class="line"/><text x="24" y="142" class="body">价格变化</text><text x="260" y="142" class="body secondary">原单价/原总额 → 当前单价/新总额</text><text x="720" y="142" class="body secondary">返回购物车；确认新总额</text><line x1="24" y1="164" x2="1288" y2="164" class="line"/><text x="24" y="208" class="body">售罄</text><text x="260" y="208" class="body secondary">原在售 → 当前售罄</text><text x="720" y="208" class="body secondary">仅返回购物车移除或替换</text><line x1="24" y1="230" x2="1288" y2="230" class="line"/><text x="24" y="274" class="body">下架</text><text x="260" y="274" class="body secondary">原上架 → 当前下架</text><text x="720" y="274" class="body secondary">仅返回购物车移除</text><line x1="24" y1="296" x2="1288" y2="296" class="line"/><text x="24" y="340" class="body">多项冲突</text><text x="260" y="340" class="body secondary">按商品逐条列出全部差异</text><text x="720" y="340" class="body secondary">处理阻断项后重新校验</text><line x1="24" y1="362" x2="1288" y2="362" class="line"/><rect x="24" y="402" width="1264" height="98" rx="10" fill="#FEF3C7"/><text x="40" y="434" class="medium warning">统一事实提示</text><text x="40" y="462" class="small" style="fill:#70420A">“尚未创建订单，也未发生收款。”不得使用“支付失败”“订单已取消”等会暗示交易已发生的文案。</text><text x="40" y="484" class="small" style="fill:#70420A">返回购物车后保留无冲突项、数量和备注，并聚焦第一个冲突订单项。</text><rect x="24" y="528" width="1264" height="116" rx="10" fill="#F7F8FA"/><text x="40" y="560" class="medium">可访问性</text><text x="40" y="588" class="small">Dialog 标题关联冲突类型；差异列表使用语义表格或描述列表；初始焦点在安全动作“返回购物车”。</text><text x="40" y="612" class="small">价格变化的确认按钮必须包含新总额；售罄和下架不渲染任何继续收款入口。</text></g>
  <text x="720" y="2994" class="tiny" text-anchor="middle">Cup Flow Coffee POS · US-S1-PAY-02 · Import SVG to Figma and convert frame-* groups to Frames</text>
</svg>
