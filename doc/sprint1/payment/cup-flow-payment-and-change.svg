<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3540" viewBox="0 0 1440 3540">
  <title>Cup Flow Coffee POS — US-S1-PAY-01 收款与找零设计</title>
  <desc>覆盖现金、微信、支付宝、银行卡、找零、提交、成功、失败和结果未知状态。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1D2129}.h1{font-size:30px;font-weight:600}.h2{font-size:24px;font-weight:600}.h3{font-size:18px;font-weight:600}.title{font-size:28px;font-weight:700}.body{font-size:14px}.medium{font-size:14px;font-weight:500}.small{font-size:12px;fill:#6B7785}.tiny{font-size:11px;fill:#6B7785}.white{fill:#FFF}.secondary{fill:#4E5969}.muted{fill:#6B7785}.error{fill:#DC2626}.success{fill:#15803D}.warning{fill:#B45309}.info{fill:#2563EB}.section{fill:#FFF;stroke:#E5E6EB}.card{fill:#FFF;stroke:#E5E6EB}.line{stroke:#E5E6EB}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1D2129" flood-opacity=".14"/></filter>
    <symbol id="check" viewBox="0 0 20 20"><path d="M4.5 10.5L8.3 14L15.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="x" viewBox="0 0 20 20"><path d="M5 5L15 15M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="1440" height="3540" fill="#F7F8FA"/>
  <g id="cover"><rect width="1440" height="152" fill="#1D2129"/><rect x="64" y="42" width="12" height="64" rx="6" fill="#DD2089"/><text x="96" y="72" class="h1 white">Cup Flow Coffee POS</text><text x="96" y="106" class="body" style="fill:#C9CDD4">US-S1-PAY-01 · 收款与找零设计 · SVG handoff</text><text x="1376" y="70" class="medium" text-anchor="end" style="fill:#FDC2DB">PAYMENT v1.0</text><text x="1376" y="100" class="small" text-anchor="end" style="fill:#C9CDD4">Desktop 1280×800 · 2026-08-17</text></g>
  <g id="principles" transform="translate(64 184)"><rect width="1312" height="224" rx="16" class="section"/><text x="24" y="42" class="h2">收款体验目标</text><text x="24" y="72" class="body secondary">核对应收、实收、找零与登记方式，明确系统只记录线下已确认的收款结果。</text><g transform="translate(24 98)"><rect x="0" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="36" cy="39" r="18" fill="#1D2129"/><text x="36" y="44" class="medium white" text-anchor="middle">01</text><text x="66" y="32" class="medium">方式完整</text><text x="66" y="55" class="small">现金、微信、支付宝、银行卡</text><rect x="316" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="352" cy="39" r="18" fill="#1D2129"/><text x="352" y="44" class="medium white" text-anchor="middle">02</text><text x="382" y="32" class="medium">金额可信</text><text x="382" y="55" class="small">应收、实收、找零同屏核对</text><rect x="632" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="668" cy="39" r="18" fill="#1D2129"/><text x="668" y="44" class="medium white" text-anchor="middle">03</text><text x="698" y="32" class="medium">防止重复</text><text x="698" y="55" class="small">提交中锁定动作和幂等提示</text><rect x="948" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="984" cy="39" r="18" fill="#DD2089"/><text x="984" y="44" class="medium white" text-anchor="middle">04</text><text x="1014" y="32" class="medium">结果可恢复</text><text x="1014" y="55" class="small">成功、失败、未知清晰区分</text></g><text x="24" y="204" class="small">品牌粉仅用于品牌标识；主动作、选中和 Focus Visible 使用 #1D2129。</text></g>
  <text x="64" y="468" class="h2">01  Cash payment / 现金找零</text><text x="1376" y="468" class="small" text-anchor="end">Dialog 560×720 · 应收 ¥63.00</text>
  <g id="frame-payment-cash" transform="translate(80 500)"><rect width="1280" height="800" rx="16" fill="#F7F8FA" stroke="#E5E6EB"/><rect width="1280" height="800" rx="16" fill="#1D2129" opacity=".35"/><g transform="translate(360 48)"><rect width="560" height="704" rx="18" fill="#FFF" filter="url(#shadow)"/><text x="28" y="44" class="title">收款</text><text x="28" y="70" class="small">订单 CF-20260817-018 · 待支付</text><circle cx="524" cy="40" r="20" fill="#F2F3F5"/><g transform="translate(514 30)" style="color:#4E5969"><use href="#x" width="20" height="20"/></g><line y1="88" x2="560" class="line"/><g transform="translate(28 112)"><text y="18" class="small">应收金额</text><text y="62" font-size="34" font-weight="700">¥63.00</text><text y="104" class="h3">收款方式</text><g transform="translate(0 122)"><rect width="116" height="52" rx="10" fill="#F2F3F5" stroke="#1D2129" stroke-width="2"/><text x="16" y="32" class="medium" style="fill:#1D2129">现金</text><circle cx="96" cy="16" r="10" fill="#1D2129"/><g transform="translate(89 9)" style="color:#FFF"><use href="#check" width="14" height="14"/></g></g><g transform="translate(126 122)"><rect width="116" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">微信</text></g><g transform="translate(252 122)"><rect width="116" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">支付宝</text></g><g transform="translate(378 122)"><rect width="126" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">银行卡</text></g><text y="214" class="h3">现金实收</text><rect y="230" width="504" height="52" rx="10" fill="#FFF" stroke="#1D2129" stroke-width="2"/><text x="16" y="264" class="h3">¥100.00</text><g transform="translate(0 298)"><rect width="92" height="44" rx="9" fill="#F2F3F5"/><text x="46" y="28" class="medium" text-anchor="middle">¥63</text><rect x="104" width="92" height="44" rx="9" fill="#F2F3F5"/><text x="150" y="28" class="medium" text-anchor="middle">¥70</text><rect x="208" width="92" height="44" rx="9" fill="#F2F3F5"/><text x="254" y="28" class="medium" text-anchor="middle">¥100</text><rect x="312" width="92" height="44" rx="9" fill="#F2F3F5"/><text x="358" y="28" class="medium" text-anchor="middle">¥200</text><rect x="416" width="88" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="460" y="28" class="medium" text-anchor="middle">自定义</text></g><rect y="366" width="504" height="86" rx="12" fill="#F2F3F5"/><text x="16" y="396" class="small">找零</text><text x="488" y="414" font-size="28" font-weight="700" text-anchor="end">¥37.00</text><text x="16" y="438" class="small">仅用于现场提示，不增加有效销售额</text><rect y="478" width="504" height="52" rx="10" fill="#1D2129"/><text x="252" y="511" class="medium white" text-anchor="middle">确认收款 · ¥63.00</text><text x="252" y="554" class="tiny" text-anchor="middle">提交后不可重复点击；收款结果以服务端响应为准</text></g></g></g>
  <text x="64" y="1380" class="h2">02  Non-cash and validation</text><text x="1376" y="1380" class="small" text-anchor="end">非现金仅登记结果；现金实收不得小于应收</text>
  <g transform="translate(64 1416)"><g><rect width="640" height="650" rx="16" class="section"/><text x="28" y="44" class="h3">微信 / 线下确认</text><text x="28" y="72" class="small">系统不发起支付、不展示付款二维码，仅记录门店已确认结果。</text><g transform="translate(28 108)"><g transform="translate(0 0)"><rect width="126" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">现金</text></g><g transform="translate(138 0)"><rect width="126" height="52" rx="10" fill="#F2F3F5" stroke="#1D2129" stroke-width="2"/><text x="16" y="32" class="medium" style="fill:#1D2129">微信</text><circle cx="106" cy="16" r="10" fill="#1D2129"/><g transform="translate(99 9)" style="color:#FFF"><use href="#check" width="14" height="14"/></g></g><g transform="translate(276 0)"><rect width="126" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">支付宝</text></g><g transform="translate(414 0)"><rect width="142" height="52" rx="10" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="16" y="32" class="medium" style="fill:#1D2129">银行卡</text></g><rect y="86" width="584" height="96" rx="10" fill="#DBEAFE"/><text x="16" y="116" class="medium info">请先在线下确认顾客已完成微信支付</text><text x="16" y="144" class="small" style="fill:#173B70">本系统仅登记 ¥63.00 的收款结果，不连接实际支付渠道。</text><text x="16" y="166" class="small" style="fill:#173B70">确认渠道、金额和顾客付款状态后再提交。</text><rect y="216" width="584" height="90" rx="10" fill="#F7F8FA"/><text x="16" y="246" class="small">登记金额</text><text x="568" y="270" font-size="26" font-weight="600" text-anchor="end">¥63.00</text><rect y="342" width="584" height="52" rx="10" fill="#1D2129"/><text x="292" y="375" class="medium white" text-anchor="middle">确认已收款</text></g></g><g transform="translate(736)"><rect width="640" height="650" rx="16" class="section"/><text x="28" y="44" class="h3">现金 / 输入错误</text><text x="28" y="72" class="small">字段级校验与恢复动作同时出现。</text><g transform="translate(28 108)"><text class="medium" y="18">现金实收</text><rect y="34" width="584" height="52" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="1.5"/><text x="16" y="68" class="h3">¥50.00</text><circle cx="558" cy="60" r="10" fill="#FEE2E2"/><text x="558" y="64" class="error" text-anchor="middle">!</text><text y="110" class="small error">实收金额不能少于应收金额 ¥63.00</text><rect y="142" width="584" height="78" rx="10" fill="#FEE2E2"/><text x="16" y="172" class="medium error">无法确认收款</text><text x="16" y="198" class="small" style="fill:#7A271A">请输入至少 ¥63.00，或重新选择收款方式。</text><rect y="262" width="584" height="52" rx="10" fill="#F2F3F5"/><text x="292" y="295" class="medium" style="fill:#A9AEB8" text-anchor="middle">确认收款</text><rect y="352" width="584" height="100" rx="10" fill="#F7F8FA"/><text x="16" y="382" class="medium">焦点行为</text><text x="16" y="408" class="small">提交后焦点返回“现金实收”，错误通过 aria-describedby 关联。</text><text x="16" y="432" class="small">Focus Visible 使用 #1D2129，错误边框继续使用语义红。</text></g></g></g>
  <text x="64" y="2140" class="h2">03  Submitting and result states</text><text x="1376" y="2140" class="small" text-anchor="end">成功、失败、结果未知不得共用同一文案</text>
  <g transform="translate(64 2176)"><g transform="translate(0)"><rect width="304" height="360" rx="16" class="section"/><rect width="304" height="10" rx="5" fill="#1D2129"/><circle cx="152" cy="82" r="34" fill="#F2F3F5"/><text x="152" y="88" class="h3" style="fill:#1D2129" text-anchor="middle">…</text><text x="152" y="148" class="h3" text-anchor="middle">正在登记收款…</text><text x="152" y="178" class="small" text-anchor="middle">锁定关闭、方式和提交按钮；aria-busy=true</text><rect x="24" y="244" width="256" height="44" rx="9" fill="#F2F3F5"/><text x="152" y="272" class="medium" style="fill:#86909C" text-anchor="middle">正在处理</text></g><g transform="translate(328)"><rect width="304" height="360" rx="16" class="section"/><rect width="304" height="10" rx="5" fill="#15803D"/><circle cx="152" cy="82" r="34" fill="#DCFCE7"/><text x="152" y="88" class="h3" style="fill:#15803D" text-anchor="middle">✓</text><text x="152" y="148" class="h3" text-anchor="middle">收款成功</text><text x="152" y="178" class="small" text-anchor="middle">订单 CF-20260817-018 · 微信 · ¥63.00</text><rect x="24" y="220" width="256" height="44" rx="9" fill="#1D2129"/><text x="152" y="248" class="medium white" text-anchor="middle">继续点单</text><rect x="24" y="276" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="304" class="medium" text-anchor="middle">查看订单</text></g><g transform="translate(656)"><rect width="304" height="360" rx="16" class="section"/><rect width="304" height="10" rx="5" fill="#DC2626"/><circle cx="152" cy="82" r="34" fill="#FEE2E2"/><text x="152" y="88" class="h3" style="fill:#DC2626" text-anchor="middle">!</text><text x="152" y="148" class="h3" text-anchor="middle">收款失败</text><text x="152" y="178" class="small" text-anchor="middle">未记录收款，可检查网络后重试</text><rect x="24" y="244" width="256" height="44" rx="9" fill="#1D2129"/><text x="152" y="272" class="medium white" text-anchor="middle">重试登记</text></g><g transform="translate(984)"><rect width="304" height="360" rx="16" class="section"/><rect width="304" height="10" rx="5" fill="#B45309"/><circle cx="152" cy="82" r="34" fill="#FEF3C7"/><text x="152" y="88" class="h3" style="fill:#B45309" text-anchor="middle">?</text><text x="152" y="148" class="h3" text-anchor="middle">收款结果待确认</text><text x="152" y="178" class="small" text-anchor="middle">不要重复收款；先查询订单最新状态</text><rect x="24" y="244" width="256" height="44" rx="9" fill="#1D2129"/><text x="152" y="272" class="medium white" text-anchor="middle">查询订单状态</text></g></g>
  <g transform="translate(64 2620)"><rect width="1312" height="780" rx="16" class="section"/><text x="24" y="42" class="h2">04  交接规则</text><text x="24" y="78" class="medium">状态</text><text x="260" y="78" class="medium">必须展示</text><text x="760" y="78" class="medium">下一步</text><line x1="24" y1="96" x2="1288" y2="96" class="line"/><text x="24" y="138" class="body">现金</text><text x="260" y="138" class="body secondary">应收、实收、快捷金额、找零</text><text x="760" y="138" class="body secondary">实收有效后确认</text><line x1="24" y1="158" x2="1288" y2="158" class="line"/><text x="24" y="196" class="body">非现金</text><text x="260" y="196" class="body secondary">线下确认说明、固定登记金额</text><text x="760" y="196" class="body secondary">确认渠道后登记</text><line x1="24" y1="216" x2="1288" y2="216" class="line"/><text x="24" y="254" class="body">提交中</text><text x="260" y="254" class="body secondary">Spinner、锁定动作、幂等语义</text><text x="760" y="254" class="body secondary">等待明确结果</text><line x1="24" y1="274" x2="1288" y2="274" class="line"/><text x="24" y="312" class="body">成功</text><text x="260" y="312" class="body secondary">订单号、金额、方式</text><text x="760" y="312" class="body secondary">继续点单 / 查看订单</text><line x1="24" y1="332" x2="1288" y2="332" class="line"/><text x="24" y="370" class="body">失败</text><text x="260" y="370" class="body secondary">明确未记录收款</text><text x="760" y="370" class="body secondary">允许安全重试</text><line x1="24" y1="390" x2="1288" y2="390" class="line"/><text x="24" y="428" class="body">未知</text><text x="260" y="428" class="body secondary">可能已记录，禁止重复</text><text x="760" y="428" class="body secondary">查询订单状态</text><line x1="24" y1="448" x2="1288" y2="448" class="line"/><rect x="24" y="512" width="1264" height="92" rx="10" fill="#F7F8FA"/><text x="40" y="542" class="medium">安全边界</text><text x="40" y="570" class="small">所有方式均为记账型；界面不暗示已调用微信、支付宝或银行卡渠道。找零只用于提示，不改变订单应收和有效销售额。</text><text x="40" y="592" class="small">结果未知不得自动重试收款，必须先查询订单和收款记录。</text><rect x="24" y="630" width="1264" height="70" rx="10" fill="#F2F3F5"/><text x="40" y="660" class="small">Focus #1D2129 · Primary #1D2129 · Success #15803D/#DCFCE7 · Error #DC2626/#FEE2E2 · Warning #B45309/#FEF3C7</text></g>
  <text x="720" y="3514" class="tiny" text-anchor="middle">Cup Flow Coffee POS · US-S1-PAY-01 · Import SVG to Figma and convert frame-* groups to Frames</text>
</svg>
