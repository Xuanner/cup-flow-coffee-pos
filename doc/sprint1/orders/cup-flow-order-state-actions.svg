<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3180" viewBox="0 0 1440 3180">
  <title>Cup Flow Coffee POS — US-S1-ORDER-02 订单状态操作设计</title>
  <desc>作废、完成、管理员取消、无权限、状态变化与重复操作设计。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1D2129}.h1{font-size:30px;font-weight:600}.h2{font-size:24px;font-weight:600}.h3{font-size:18px;font-weight:600}.title{font-size:28px;font-weight:700}.body{font-size:14px}.medium{font-size:14px;font-weight:500}.small{font-size:12px;fill:#6B7785}.tiny{font-size:11px;fill:#6B7785}.white{fill:#FFF}.secondary{fill:#4E5969}.muted{fill:#6B7785}.error{fill:#DC2626}.success{fill:#15803D}.warning{fill:#B45309}.info{fill:#2563EB}.section{fill:#FFF;stroke:#E5E6EB}.card{fill:#FFF;stroke:#E5E6EB}.line{stroke:#E5E6EB}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1D2129" flood-opacity=".14"/></filter>
    <symbol id="check" viewBox="0 0 20 20"><path d="M4.5 10.5L8.3 14L15.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="x" viewBox="0 0 20 20"><path d="M5 5L15 15M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="1440" height="3180" fill="#F7F8FA"/>
  <g id="cover"><rect width="1440" height="152" fill="#1D2129"/><rect x="64" y="42" width="12" height="64" rx="6" fill="#DD2089"/><text x="96" y="72" class="h1 white">Cup Flow Coffee POS</text><text x="96" y="106" class="body" style="fill:#C9CDD4">US-S1-ORDER-02 · 订单状态操作设计 · SVG handoff</text><text x="1376" y="70" class="medium" text-anchor="end" style="fill:#FDC2DB">ORDER ACTIONS v1.0</text><text x="1376" y="100" class="small" text-anchor="end" style="fill:#C9CDD4">Desktop 1280×800 · 2026-08-17</text></g>
  <g id="principles" transform="translate(64 184)"><rect width="1312" height="224" rx="16" class="section"/><text x="24" y="42" class="h2">状态操作目标</text><text x="24" y="72" class="body secondary">只提供当前状态与角色允许的动作，在确认前说明条件、后果和线下处理责任。</text><g transform="translate(24 98)"><rect x="0" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="36" cy="39" r="18" fill="#1D2129"/><text x="36" y="44" class="medium white" text-anchor="middle">01</text><text x="66" y="32" class="medium">状态合法</text><text x="66" y="55" class="small">待支付作废、已支付完成</text><rect x="316" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="352" cy="39" r="18" fill="#1D2129"/><text x="352" y="44" class="medium white" text-anchor="middle">02</text><text x="382" y="32" class="medium">权限明确</text><text x="382" y="55" class="small">管理员才能取消</text><rect x="632" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="668" cy="39" r="18" fill="#1D2129"/><text x="668" y="44" class="medium white" text-anchor="middle">03</text><text x="698" y="32" class="medium">后果可见</text><text x="698" y="55" class="small">取消不自动退款</text><rect x="948" width="300" height="78" rx="12" fill="#F2F3F5"/><circle cx="984" cy="39" r="18" fill="#DD2089"/><text x="984" y="44" class="medium white" text-anchor="middle">04</text><text x="1014" y="32" class="medium">并发安全</text><text x="1014" y="55" class="small">状态变化与重复操作可恢复</text></g><text x="24" y="204" class="small">品牌粉仅用于品牌标识；主动作、选中和 Focus Visible 使用 #1D2129。</text></g>
 <text x="64" y="468" class="h2">01  Allowed state actions</text><text x="1376" y="468" class="small" text-anchor="end">非法动作不渲染为可继续入口</text>
 <g id="frame-order-state-actions" transform="translate(80 500)"><rect width="1280" height="800" rx="16" fill="#F7F8FA" stroke="#E5E6EB"/><path d="M16 0H200V800H16Q0 800 0 784V16Q0 0 16 0Z" fill="#FFF"/><line x1="200" y1="0" x2="200" y2="800" class="line"/><circle cx="36" cy="36" r="20" fill="#FFE8F1"/><text x="64" y="34" class="medium">Cup Flow</text><text x="64" y="52" class="tiny">Coffee POS</text><g transform="translate(16 92)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">收银台</text></g><g transform="translate(16 148)"><rect width="168" height="48" rx="10" fill="#F2F3F5"/><rect width="4" height="48" rx="2" fill="#1D2129"/><text x="20" y="30" class="medium">订单</text></g><g transform="translate(16 204)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">商品</text></g><g transform="translate(16 260)"><rect width="168" height="48" rx="10" fill="#FFF"/><text x="20" y="30" class="body secondary">经营看板</text></g><g transform="translate(200)"><rect width="1080" height="72" fill="#FFF"/><text x="24" y="42" class="h3">订单详情 · CF-20260817-018</text><g transform="translate(24 92)"><rect width="1032" height="684" rx="14" fill="#FFF"/><text x="24" y="42" class="h3">订单状态操作</text><g transform="translate(24 76)"><rect width="296" height="178" rx="12" fill="#F7F8FA"/><rect x="16" y="16" width="84" height="28" rx="14" fill="#FEF3C7"/><text x="58" y="35" class="small warning" text-anchor="middle">待支付</text><text x="16" y="76" class="medium">收银员可作废</text><text x="16" y="102" class="small">作废后不可收款，记录操作人和时间。</text><rect x="16" y="122" width="264" height="40" rx="9" fill="#FFF" stroke="#DC2626"/><text x="148" y="148" class="medium error" text-anchor="middle">作废订单</text><rect x="320" width="296" height="178" rx="12" fill="#F7F8FA"/><rect x="336" y="16" width="84" height="28" rx="14" fill="#DBEAFE"/><text x="378" y="35" class="small info" text-anchor="middle">已支付</text><text x="336" y="76" class="medium">收银员可完成</text><text x="336" y="102" class="small">确认商品已交付，记录完成时间。</text><rect x="336" y="122" width="264" height="40" rx="9" fill="#1D2129"/><text x="468" y="148" class="medium white" text-anchor="middle">标记为已完成</text><rect x="640" width="344" height="178" rx="12" fill="#F7F8FA"/><rect x="656" y="16" width="84" height="28" rx="14" fill="#DCFCE7"/><text x="698" y="35" class="small success" text-anchor="middle">已完成</text><text x="656" y="76" class="medium">管理员可取消</text><text x="656" y="102" class="small">必须填写原因；系统不自动退款。</text><rect x="656" y="122" width="312" height="40" rx="9" fill="#FFF" stroke="#DC2626"/><text x="812" y="148" class="medium error" text-anchor="middle">取消订单</text></g><line x1="24" y1="286" x2="1008" y2="286" class="line"/><text x="24" y="326" class="h3">状态机摘要</text><g transform="translate(24 356)"><rect width="160" height="52" rx="10" fill="#FEF3C7"/><text x="80" y="32" class="medium warning" text-anchor="middle">待支付</text><path d="M172 26H232" stroke="#A9AEB8"/><text x="202" y="16" class="tiny" text-anchor="middle">收款</text><rect x="244" width="160" height="52" rx="10" fill="#DBEAFE"/><text x="324" y="32" class="medium info" text-anchor="middle">已支付</text><path d="M416 26H476" stroke="#A9AEB8"/><text x="446" y="16" class="tiny" text-anchor="middle">完成</text><rect x="488" width="160" height="52" rx="10" fill="#DCFCE7"/><text x="568" y="32" class="medium success" text-anchor="middle">已完成</text><path d="M80 64V112" stroke="#A9AEB8"/><text x="94" y="92" class="tiny">作废</text><rect y="124" width="160" height="52" rx="10" fill="#F2F3F5"/><text x="80" y="156" class="medium secondary" text-anchor="middle">已作废</text><path d="M568 64V112" stroke="#A9AEB8"/><text x="582" y="92" class="tiny">管理员取消</text><rect x="488" y="124" width="160" height="52" rx="10" fill="#FEE2E2"/><text x="568" y="156" class="medium error" text-anchor="middle">已取消</text></g><rect x="704" y="356" width="280" height="176" rx="10" fill="#F2F3F5"/><text x="720" y="388" class="medium">终态规则</text><text x="720" y="418" class="small">已作废、已取消：不提供后续状态动作。</text><text x="720" y="446" class="small">已完成：仅管理员可取消。</text><text x="720" y="474" class="small">服务端始终执行最终状态机校验。</text><text x="720" y="502" class="small">所有成功操作写入审计时间线。</text></g></g> </g>
 <text x="64" y="1380" class="h2">02  Confirmation dialogs</text><text x="1376" y="1380" class="small" text-anchor="end">危险动作默认焦点在取消；取消订单必须填写原因</text>
 <g transform="translate(64 1416)"><g id="frame-void-dialog"><rect width="416" height="620" rx="16" class="section"/><text x="28" y="44" class="h3">作废待支付订单？</text><text x="28" y="74" class="small">订单 CF-20260817-017 · ¥42.00</text><rect x="28" y="104" width="360" height="96" rx="10" fill="#FEE2E2"/><text x="44" y="136" class="medium error">作废后不可再收款</text><text x="44" y="164" class="small" style="fill:#7A271A">购物车不会恢复；操作人和时间将被记录。</text><rect x="28" y="236" width="168" height="48" rx="9" fill="#FFF" stroke="#1D2129" stroke-width="2"/><text x="112" y="266" class="medium" text-anchor="middle">取消</text><rect x="220" y="236" width="168" height="48" rx="9" fill="#DC2626"/><text x="304" y="266" class="medium white" text-anchor="middle">确认作废</text></g><g id="frame-complete-dialog" transform="translate(448)"><rect width="416" height="620" rx="16" class="section"/><text x="28" y="44" class="h3">标记订单为已完成？</text><text x="28" y="74" class="small">仅在商品已交付给顾客后执行</text><rect x="28" y="104" width="360" height="96" rx="10" fill="#DBEAFE"/><text x="44" y="136" class="medium info">状态将从已支付变为已完成</text><text x="44" y="164" class="small" style="fill:#173B70">重复提交不会产生第二次业务结果。</text><rect x="28" y="236" width="168" height="48" rx="9" fill="#FFF" stroke="#1D2129" stroke-width="2"/><text x="112" y="266" class="medium" text-anchor="middle">取消</text><rect x="220" y="236" width="168" height="48" rx="9" fill="#1D2129"/><text x="304" y="266" class="medium white" text-anchor="middle">确认完成</text></g><g id="frame-cancel-dialog" transform="translate(896)"><rect width="416" height="620" rx="16" class="section"/><text x="28" y="44" class="h3">取消已支付订单</text><text x="28" y="74" class="small">仅管理员 · 原状态：已支付</text><rect x="28" y="104" width="360" height="92" rx="10" fill="#FEF3C7"/><text x="44" y="136" class="medium warning">系统不会自动退款</text><text x="44" y="164" class="small" style="fill:#70420A">请按门店流程线下处理退款并留存凭证。</text><text x="28" y="232" class="medium">取消原因 *</text><rect x="28" y="248" width="360" height="96" rx="10" fill="#FFF" stroke="#C9CDD4"/><text x="42" y="278" class="small">说明异常与线下处理情况</text><text x="374" y="330" class="tiny" text-anchor="end">0 / 200</text><rect x="28" y="376" width="168" height="48" rx="9" fill="#FFF" stroke="#1D2129" stroke-width="2"/><text x="112" y="406" class="medium" text-anchor="middle">返回</text><rect x="220" y="376" width="168" height="48" rx="9" fill="#F2F3F5"/><text x="304" y="406" class="medium" style="fill:#A9AEB8" text-anchor="middle">填写原因后取消</text><rect x="28" y="464" width="360" height="94" rx="10" fill="#F7F8FA"/><text x="44" y="494" class="small">取消后金额从有效销售额排除，计入取消金额。</text><text x="44" y="520" class="small">记录原因、操作人、时间和取消前状态。</text></g></g>
 <g transform="translate(64 2120)"><rect width="1312" height="920" rx="16" class="section"/><text x="24" y="42" class="h2">03  无权限、状态变化与重复操作</text><g transform="translate(24 84)"><rect width="392" height="280" rx="12" fill="#F7F8FA"/><circle cx="40" cy="44" r="22" fill="#FEE2E2"/><text x="40" y="50" class="h3" style="fill:#DC2626" text-anchor="middle">×</text><text x="76" y="40" class="h3">无权限</text><text x="24" y="94" class="medium">当前账号无权取消订单</text><text x="24" y="126" class="small">不显示确认按钮；提供返回详情或联系管理员</text><rect x="24" y="190" width="344" height="44" rx="9" fill="#1D2129"/><text x="196" y="218" class="medium white" text-anchor="middle">返回订单详情</text></g><g transform="translate(440 84)"><rect width="392" height="280" rx="12" fill="#F7F8FA"/><circle cx="40" cy="44" r="22" fill="#FEF3C7"/><text x="40" y="50" class="h3" style="fill:#B45309" text-anchor="middle">!</text><text x="76" y="40" class="h3">状态已变化</text><text x="24" y="94" class="medium">订单已由另一位员工更新为已完成</text><text x="24" y="126" class="small">刷新详情并展示最新状态，不允许按旧状态继续</text><rect x="24" y="190" width="344" height="44" rx="9" fill="#1D2129"/><text x="196" y="218" class="medium white" text-anchor="middle">刷新订单状态</text></g><g transform="translate(856 84)"><rect width="392" height="280" rx="12" fill="#F7F8FA"/><circle cx="40" cy="44" r="22" fill="#DBEAFE"/><text x="40" y="50" class="h3" style="fill:#2563EB" text-anchor="middle">i</text><text x="76" y="40" class="h3">重复操作</text><text x="24" y="94" class="medium">该订单已经完成，无需再次操作</text><text x="24" y="126" class="small">展示已记录的操作人和时间，不产生新结果</text><rect x="24" y="190" width="344" height="44" rx="9" fill="#1D2129"/><text x="196" y="218" class="medium white" text-anchor="middle">查看操作记录</text></g><text x="24" y="420" class="medium">状态</text><text x="244" y="420" class="medium">可用动作</text><text x="700" y="420" class="medium">禁止动作</text><line x1="24" y1="438" x2="1288" y2="438" class="line"/><text x="24" y="480" class="body">待支付</text><text x="244" y="480" class="body secondary">收银员作废</text><text x="700" y="480" class="body secondary">完成、取消</text><line x1="24" y1="500" x2="1288" y2="500" class="line"/><text x="24" y="538" class="body">已支付</text><text x="244" y="538" class="body secondary">收银员完成；管理员取消</text><text x="700" y="538" class="body secondary">作废</text><line x1="24" y1="558" x2="1288" y2="558" class="line"/><text x="24" y="596" class="body">已完成</text><text x="244" y="596" class="body secondary">管理员取消</text><text x="700" y="596" class="body secondary">再次完成、作废</text><line x1="24" y1="616" x2="1288" y2="616" class="line"/><text x="24" y="654" class="body">已作废 / 已取消</text><text x="244" y="654" class="body secondary">查看操作记录</text><text x="700" y="654" class="body secondary">所有状态变更</text><line x1="24" y1="674" x2="1288" y2="674" class="line"/><rect x="24" y="716" width="1264" height="100" rx="10" fill="#F2F3F5"/><text x="40" y="748" class="medium">交接</text><text x="40" y="776" class="small">操作提交中禁用关闭与重复提交；服务端返回冲突时以最新状态覆盖本地状态。任何错误都不得保留可执行的非法确认入口。</text><text x="40" y="800" class="small">取消成功后在时间线显示：取消前状态、原因、管理员、时间、线下退款提醒。</text></g>
