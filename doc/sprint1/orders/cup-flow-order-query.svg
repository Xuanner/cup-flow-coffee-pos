idth="620" height="556" rx="14" fill="#FFF"/><text x="20" y="38" class="medium">订单号 / 时间</text><text x="282" y="38" class="medium">状态</text><text x="416" y="38" class="medium">收款</text><text x="590" y="38" class="medium" text-anchor="end">金额</text><line y1="54" x2="620" class="line"/><g transform="translate(0 56)"><rect x="8" y="4" width="604" height="76" rx="9" fill="#F2F3F5"/><rect x="8" y="4" width="4" height="76" rx="2" fill="#1D2129"/><text x="20" y="34" class="medium">CF-20260817-018</text><text x="20" y="56" class="small">10:24</text><rect x="270" y="24" width="76" height="28" rx="14" fill="#DBEAFE"/><text x="308" y="43" class="small" style="fill:#2563EB" text-anchor="middle">已支付</text><text x="416" y="44" class="body">微信</text><text x="590" y="44" class="medium" text-anchor="end">¥63.00</text></g><g transform="translate(0 140)"><rect x="8" y="4" width="604" height="76" rx="9" fill="#FFF"/><text x="20" y="34" class="medium">CF-20260817-017</text><text x="20" y="56" class="small">10:18</text><rect x="270" y="24" width="76" height="28" rx="14" fill="#FEF3C7"/><text x="308" y="43" class="small" style="fill:#B45309" text-anchor="middle">待支付</text><text x="416" y="44" class="body">—</text><text x="590" y="44" class="medium" text-anchor="end">¥42.00</text></g><g transform="translate(0 224)"><rect x="8" y="4" width="604" height="76" rx="9" fill="#FFF"/><text x="20" y="34" class="medium">CF-20260817-016</text><text x="20" y="56" class="small">10:02</text><rect x="270" y="24" width="76" height="28" rx="14" fill="#DCFCE7"/><text x="308" y="43" class="small" style="fill:#15803D" text-anchor="middle">已完成</text><text x="416" y="44" class="body">现金</text><text x="590" y="44" class="medium" text-anchor="end">¥88.00</text></g><g transform="translate(0 308)"><rect x="8" y="4" width="604" height="76" rx="9" fill="#FFF"/><text x="20" y="34" class="medium">CF-20260817-015</text><text x="20" y="56" class="small">09:54</text><rect x="270" y="24" width="76" height="28" rx="14" fill="#F2F3F5"/><text x="308" y="43" class="small" style="fill:#4E5969" text-anchor="middle">已作废</text><text x="416" y="44" class="body">—</text><text x="590" y="44" class="medium" text-anchor="end">¥26.00</text></g><g transform="translate(0 392)"><rect x="8" y="4" width="604" height="76" rx="9" fill="#FFF"/><text x="20" y="34" class="medium">CF-20260817-014</text><text x="20" y="56" class="small">09:41</text><rect x="270" y="24" width="76" height="28" rx="14" fill="#FEE2E2"/><text x="308" y="43" class="small" style="fill:#DC2626" text-anchor="middle">已取消</text><text x="416" y="44" class="body">支付宝</text><text x="590" y="44" class="medium" text-anchor="end">¥74.00</text></g></g><g transform="translate(660 220)"><rect width="396" height="556" rx="14" fill="#FFF"/><text x="20" y="36" class="h3">订单详情</text><rect x="284" y="14" width="92" height="30" rx="15" fill="#DBEAFE"/><text x="330" y="34" class="small info" text-anchor="middle">已支付</text><text x="20" y="70" class="small">CF-20260817-018 · 2026-08-17 10:24</text><line y1="90" x2="396" class="line"/><text x="20" y="124" class="medium">商品快照</text><text x="20" y="154" class="body">拿铁 × 1</text><text x="376" y="154" class="body" text-anchor="end">¥27.00</text><text x="20" y="178" class="small">大杯 · 热 · 少糖 · 燕麦奶</text><text x="20" y="212" class="body">经典美式 × 2</text><text x="376" y="212" class="body" text-anchor="end">¥36.00</text><text x="20" y="236" class="small">中杯 · 冰 · 无糖</text><rect x="20" y="260" width="356" height="62" rx="9" fill="#F7F8FA"/><text x="34" y="286" class="small">整单备注</text><text x="34" y="308" class="body">两杯分开装；内容超长时最多显示 3 行…</text><text x="20" y="356" class="medium">金额与收款</text><text x="20" y="384" class="small">应收 / 实收</text><text x="376" y="384" class="medium" text-anchor="end">¥63.00 / ¥63.00</text><text x="20" y="410" class="small">方式 / 操作人</text><text x="376" y="410" class="body" text-anchor="end">微信 / 林晨</text><text x="20" y="444" class="medium">关键时间</text><text x="20" y="472" class="small">创建 10:23:44 · 收款 10:24:12</text><text x="20" y="496" class="small">完成 — · 取消 —</text><rect x="20" y="518" width="356" height="20" rx="10" fill="#F2F3F5"/><text x="198" y="533" class="tiny" text-anchor="middle">长订单明细在详情面板内滚动</text></g></g> </g>
  <text x="64" y="1380" class="h2">02  Loading, empty and failed</text><text x="1376" y="1380" class="small" text-anchor="end">查询条件保留；失败不清空上一次成功结果</text>
  <g transform="translate(64 1416)"><g transform="translate(0)"><rect width="304" height="360" rx="16" class="section"/><circle cx="152" cy="88" r="36" fill="#DBEAFE"/><text x="152" y="95" class="h3" style="fill:#2563EB" text-anchor="middle">…</text><text x="152" y="154" class="h3" text-anchor="middle">正在查询订单</text><text x="152" y="184" class="small" text-anchor="middle">保留筛选条件，表格显示骨架，不展示虚假数据</text><rect x="24" y="250" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="278" class="medium " text-anchor="middle">取消查询</text></g><g transform="translate(328)"><rect width="304" height="360" rx="16" class="section"/><circle cx="152" cy="88" r="36" fill="#F2F3F5"/><text x="152" y="95" class="h3" style="fill:#4E5969" text-anchor="middle">○</text><text x="152" y="154" class="h3" text-anchor="middle">当天还没有订单</text><text x="152" y="184" class="small" text-anchor="middle">尝试选择其他日期；不显示“查询失败”</text><rect x="24" y="250" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="278" class="medium " text-anchor="middle">选择日期</text></g><g transform="translate(656)"><rect width="304" height="360" rx="16" class="section"/><circle cx="152" cy="88" r="36" fill="#F2F3F5"/><text x="152" y="95" class="h3" style="fill:#4E5969" text-anchor="middle">○</text><text x="152" y="154" class="h3" text-anchor="middle">没有匹配的订单</text><text x="152" y="184" class="small" text-anchor="middle">清除订单号或状态筛选</text><rect x="24" y="250" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="278" class="medium " text-anchor="middle">清除筛选</text></g><g transform="translate(984)"><rect width="304" height="360" rx="16" class="section"/><circle cx="152" cy="88" r="36" fill="#FEE2E2"/><text x="152" y="95" class="h3" style="fill:#DC2626" text-anchor="middle">!</text><text x="152" y="154" class="h3" text-anchor="middle">订单查询失败</text><text x="152" y="184" class="small" text-anchor="middle">保留筛选条件，可重试；错误不展示内部信息</text><rect x="24" y="250" width="256" height="44" rx="9" fill="#1D2129" stroke="#1D2129"/><text x="152" y="278" class="medium white" text-anchor="middle">重新查询</text></g></g>
  <g transform="translate(64 1850)"><rect width="1312" height="1350" rx="16" class="section"/><text x="24" y="42" class="h2">03  状态标签与长内容规则</text><g transform="translate(24 76)"><rect x="0" width="148" height="40" rx="20" fill="#FEF3C7"/><text x="74" y="26" class="medium" style="fill:#B45309" text-anchor="middle">待支付</text><rect x="180" width="148" height="40" rx="20" fill="#DBEAFE"/><text x="254" y="26" class="medium" style="fill:#2563EB" text-anchor="middle">已支付</text><rect x="360" width="148" height="40" rx="20" fill="#DCFCE7"/><text x="434" y="26" class="medium" style="fill:#15803D" text-anchor="middle">已完成</text><rect x="540" width="148" height="40" rx="20" fill="#F2F3F5"/><text x="614" y="26" class="medium" style="fill:#4E5969" text-anchor="middle">已作废</text><rect x="720" width="148" height="40" rx="20" fill="#FEE2E2"/><text x="794" y="26" class="medium" style="fill:#DC2626" text-anchor="middle">已取消</text></g><text x="24" y="166" class="medium">内容</text><text x="260" y="166" class="medium">列表规则</text><text x="720" y="166" class="medium">详情规则</text><line x1="24" y1="184" x2="1288" y2="184" class="line"/><text x="24" y="230" class="body">长订单</text><text x="260" y="230" class="body secondary">列表固定行高，显示商品数和总额</text><text x="720" y="230" class="body secondary">订单项区域独立滚动，金额与操作固定</text><line x1="24" y1="250" x2="1288" y2="250" class="line"/><text x="24" y="294" class="body">长备注</text><text x="260" y="294" class="body secondary">列表不展示或单行省略</text><text x="720" y="294" class="body secondary">最多 3 行，展开查看全文</text><line x1="24" y1="314" x2="1288" y2="314" class="line"/><text x="24" y="358" class="body">取消原因</text><text x="260" y="358" class="body secondary">列表仅显示已取消标签</text><text x="720" y="358" class="body secondary">显示原因全文、操作人、时间和取消前状态</text><line x1="24" y1="378" x2="1288" y2="378" class="line"/><text x="24" y="422" class="body">商品与选项</text><text x="260" y="422" class="body secondary">列表只显示商品数量摘要</text><text x="720" y="422" class="body secondary">使用下单时名称、配置和价格快照</text><line x1="24" y1="442" x2="1288" y2="442" class="line"/><rect x="24" y="500" width="1264" height="112" rx="10" fill="#F7F8FA"/><text x="40" y="532" class="medium">响应式</text><text x="40" y="560" class="small">Desktop：列表与详情同屏；Tablet：详情 Drawer；Mobile：筛选折叠，订单列表转卡片，详情为独立视图。</text><text x="40" y="586" class="small">所有状态标签包含文字；当前行使用浅底、深色指示条和 aria-current，不只使用颜色。</text><rect x="24" y="642" width="1264" height="112" rx="10" fill="#F2F3F5"/><text x="40" y="674" class="medium">查询约束</text><text x="40" y="702" class="small">订单号只接受完整订单号；日期为门店时区单日；状态可多选或单选，但需在交接中固定实现。</text><text x="40" y="728" class="small">失败详情只展示可理解的错误编号，不显示数据库、接口堆栈或内部服务名。</text></g>
