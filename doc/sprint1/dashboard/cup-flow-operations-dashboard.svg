ont-size="26" font-weight="600">¥44.34</text><text x="16" y="98" class="small">销售额 ÷ 有效订单</text></g><g transform="translate(774)"><rect width="242" height="118" rx="14" fill="#FFF"/><text x="16" y="34" class="small">取消订单</text><text x="16" y="72" font-size="26" font-weight="600">8</text><text x="16" y="98" class="small">取消金额 ¥326.00</text></g></g><g transform="translate(24 230)"><rect width="644" height="546" rx="14" fill="#FFF"/><text x="20" y="38" class="h3">商品销量 Top 10</text><text x="624" y="38" class="small" text-anchor="end">按有效订单商品数量</text><line y1="56" x2="644" class="line"/><g transform="translate(20 74)"><text x="0" y="24" class="medium">1</text><text x="42" y="24" class="body">拿铁</text><rect x="210" y="10" width="287" height="20" rx="10" fill="#1D2129" opacity="1"/><text x="520" y="24" class="body" text-anchor="end">82 杯</text><text x="604" y="24" class="small" text-anchor="end">¥2,214</text></g><g transform="translate(20 134)"><text x="0" y="24" class="medium">2</text><text x="42" y="24" class="body">经典美式</text><rect x="210" y="10" width="259" height="20" rx="10" fill="#1D2129" opacity="0.92"/><text x="520" y="24" class="body" text-anchor="end">74 杯</text><text x="604" y="24" class="small" text-anchor="end">¥1,332</text></g><g transform="translate(20 194)"><text x="0" y="24" class="medium">3</text><text x="42" y="24" class="body">澳白</text><rect x="210" y="10" width="178.5" height="20" rx="10" fill="#1D2129" opacity="0.84"/><text x="520" y="24" class="body" text-anchor="end">51 杯</text><text x="604" y="24" class="small" text-anchor="end">¥1,224</text></g><g transform="translate(20 254)"><text x="0" y="24" class="medium">4</text><text x="42" y="24" class="body">卡布奇诺</text><rect x="210" y="10" width="147" height="20" rx="10" fill="#1D2129" opacity="0.76"/><text x="520" y="24" class="body" text-anchor="end">42 杯</text><text x="604" y="24" class="small" text-anchor="end">¥924</text></g><g transform="translate(20 314)"><text x="0" y="24" class="medium">5</text><text x="42" y="24" class="body">焦糖玛奇朵</text><rect x="210" y="10" width="126" height="20" rx="10" fill="#1D2129" opacity="0.6799999999999999"/><text x="520" y="24" class="body" text-anchor="end">36 杯</text><text x="604" y="24" class="small" text-anchor="end">¥936</text></g><g transform="translate(20 374)"><text x="0" y="24" class="medium">6</text><text x="42" y="24" class="body">抹茶拿铁</text><rect x="210" y="10" width="98" height="20" rx="10" fill="#1D2129" opacity="0.6"/><text x="520" y="24" class="body" text-anchor="end">28 杯</text><text x="604" y="24" class="small" text-anchor="end">¥672</text></g><g transform="translate(20 434)"><text x="0" y="24" class="medium">7</text><text x="42" y="24" class="body">可颂</text><rect x="210" y="10" width="87.5" height="20" rx="10" fill="#1D2129" opacity="0.52"/><text x="520" y="24" class="body" text-anchor="end">25 杯</text><text x="604" y="24" class="small" text-anchor="end">¥375</text></g></g><g transform="translate(684 230)"><rect width="372" height="300" rx="14" fill="#FFF"/><text x="20" y="38" class="h3">收款方式构成</text><text x="352" y="38" class="small" text-anchor="end">合计 ¥12,680.00</text><circle cx="112" cy="156" r="64" fill="none" stroke="#E5E6EB" stroke-width="28"/><path d="M112 92A64 64 0 0 1 173 137" fill="none" stroke="#1D2129" stroke-width="28"/><path d="M173 137A64 64 0 0 1 119 220" fill="none" stroke="#4E5969" stroke-width="28"/><path d="M119 220A64 64 0 0 1 50 164" fill="none" stroke="#86909C" stroke-width="28"/><text x="112" y="152" class="small" text-anchor="middle">有效销售额</text><text x="112" y="176" class="medium" text-anchor="middle">¥12,680</text><circle cx="220" cy="106" r="5" fill="#1D2129"/><text x="234" y="111" class="small">微信</text><text x="352" y="111" class="small" text-anchor="end">¥5,706 · 45%</text><circle cx="220" cy="144" r="5" fill="#4E5969"/><text x="234" y="149" class="small">支付宝</text><text x="352" y="149" class="small" text-anchor="end">¥3,804 · 30%</text><circle cx="220" cy="182" r="5" fill="#86909C"/><text x="234" y="187" class="small">现金</text><text x="352" y="187" class="small" text-anchor="end">¥1,902 · 15%</text><circle cx="220" cy="220" r="5" fill="#C9CDD4"/><text x="234" y="225" class="small">银行卡</text><text x="352" y="225" class="small" text-anchor="end">¥1,268 · 10%</text></g><g transform="translate(684 546)"><rect width="372" height="230" rx="14" fill="#FFF"/><text x="20" y="38" class="h3">数据口径</text><text x="20" y="76" class="small">有效销售额：已支付 + 已完成，排除已取消。</text><text x="20" y="106" class="small">有效订单数：有效订单去重数量。</text><text x="20" y="136" class="small">客单价：有效销售额 ÷ 有效订单数。</text><text x="20" y="166" class="small">取消金额：已取消订单的原应收金额。</text><text x="20" y="196" class="small">收款构成合计必须等于有效销售额。</text></g></g> </g>
 <text x="64" y="1380" class="h2">02  Date, loading, empty and failed</text><text x="1376" y="1380" class="small" text-anchor="end">未来日期不可选择；无有效订单提供解释性空状态</text>
 <g transform="translate(64 1416)"><g transform="translate(0)"><rect width="304" height="400" rx="16" class="section"/><circle cx="152" cy="82" r="34" fill="#F2F3F5"/><text x="152" y="89" class="h3" style="fill:#4E5969" text-anchor="middle">○</text><text x="152" y="144" class="h3" text-anchor="middle">未来日期不可选择</text><text x="152" y="176" class="small" text-anchor="middle">日期控件 disabled；说明按门店自然日统计</text><rect x="24" y="292" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="320" class="medium " text-anchor="middle">返回今天</text></g><g transform="translate(328)"><rect width="304" height="400" rx="16" class="section"/><circle cx="152" cy="82" r="34" fill="#DBEAFE"/><text x="152" y="89" class="h3" style="fill:#2563EB" text-anchor="middle">…</text><text x="152" y="144" class="h3" text-anchor="middle">正在加载经营数据</text><text x="152" y="176" class="small" text-anchor="middle">指标和图表使用骨架；保留所选日期</text><rect x="24" y="292" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="320" class="medium " text-anchor="middle">等待加载</text></g><g transform="translate(656)"><rect width="304" height="400" rx="16" class="section"/><circle cx="152" cy="82" r="34" fill="#F2F3F5"/><text x="152" y="89" class="h3" style="fill:#4E5969" text-anchor="middle">○</text><text x="152" y="144" class="h3" text-anchor="middle">当天暂无有效订单</text><text x="152" y="176" class="small" text-anchor="middle">销售额 ¥0、订单 0；Top 10 与构成显示解释性空状态</text><rect x="24" y="292" width="256" height="44" rx="9" fill="#FFF" stroke="#C9CDD4"/><text x="152" y="320" class="medium " text-anchor="middle">选择其他日期</text></g><g transform="translate(984)"><rect width="304" height="400" rx="16" class="section"/><circle cx="152" cy="82" r="34" fill="#FEE2E2"/><text x="152" y="89" class="h3" style="fill:#DC2626" text-anchor="middle">!</text><text x="152" y="144" class="h3" text-anchor="middle">看板查询失败</text><text x="152" y="176" class="small" text-anchor="middle">保留日期；允许重试，不显示过期数据为当前结果</text><rect x="24" y="292" width="256" height="44" rx="9" fill="#1D2129" stroke="#1D2129"/><text x="152" y="320" class="medium white" text-anchor="middle">重新查询</text></g></g>
 <g transform="translate(64 1900)"><rect width="1312" height="1100" rx="16" class="section"/><text x="24" y="42" class="h2">03  指标口径与交接</text><text x="24" y="82" class="medium">指标</text><text x="256" y="82" class="medium">定义</text><text x="790" y="82" class="medium">零值/异常展示</text><line x1="24" y1="100" x2="1288" y2="100" class="line"/><text x="24" y="144" class="body">有效销售额</text><text x="256" y="144" class="body secondary">已支付与已完成订单应收金额，排除已取消</text><text x="790" y="144" class="body secondary">¥0.00，不用短横线</text><line x1="24" y1="164" x2="1288" y2="164" class="line"/><text x="24" y="202" class="body">有效订单数</text><text x="256" y="202" class="body secondary">有效订单去重数量</text><text x="790" y="202" class="body secondary">0 单</text><line x1="24" y1="222" x2="1288" y2="222" class="line"/><text x="24" y="260" class="body">客单价</text><text x="256" y="260" class="body secondary">有效销售额 ÷ 有效订单数</text><text x="790" y="260" class="body secondary">无有效订单时显示 — 并解释</text><line x1="24" y1="280" x2="1288" y2="280" class="line"/><text x="24" y="318" class="body">取消订单数</text><text x="256" y="318" class="body secondary">已取消订单数量</text><text x="790" y="318" class="body secondary">0 单</text><line x1="24" y1="338" x2="1288" y2="338" class="line"/><text x="24" y="376" class="body">取消金额</text><text x="256" y="376" class="body secondary">已取消订单原应收金额</text><text x="790" y="376" class="body secondary">¥0.00</text><line x1="24" y1="396" x2="1288" y2="396" class="line"/><text x="24" y="434" class="body">Top 10</text><text x="256" y="434" class="body secondary">按有效订单商品数量降序，同量按销售额/名称稳定排序</text><text x="790" y="434" class="body secondary">解释性空状态</text><line x1="24" y1="454" x2="1288" y2="454" class="line"/><text x="24" y="492" class="body">收款构成</text><text x="256" y="492" class="body secondary">有效订单的收款金额和占比，合计等于有效销售额</text><text x="790" y="492" class="body secondary">无有效订单时不画空饼图</text><line x1="24" y1="512" x2="1288" y2="512" class="line"/><rect x="24" y="570" width="1264" height="110" rx="10" fill="#F7F8FA"/><text x="40" y="602" class="medium">日期与刷新</text><text x="40" y="630" class="small">日期只能选择今天或历史单日；“今天”按门店时区计算。切换日期后所有卡片、排行和构成使用同一查询口径。</text><text x="40" y="654" class="small">展示最后更新时间；自动刷新时不得清空当前数据，刷新失败需提示数据可能不是最新。</text><rect x="24" y="714" width="1264" height="110" rx="10" fill="#F2F3F5"/><text x="40" y="746" class="medium">可访问性</text><text x="40" y="774" class="small">图表同时提供数据表；不只依赖条形长度和色差。日期控件有禁用原因，加载区域使用 aria-busy。</text><text x="40" y="798" class="small">金额和百分比使用可朗读格式，Top 10 顺序与 DOM 顺序一致。</text></g>
