spring:
  application:
    name: cup-flow-coffee-pos-java
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cup_flow}
    username: ${DB_USERNAME:cup_flow}
    password: ${DB_PASSWORD:cup_flow_local}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 3
  type-aliases-package: com.cupflow.pos

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.cupflow.pos: INFO

info:
  app:
    name: ${spring.application.name}
    api-version: v1

auth:
  security:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
